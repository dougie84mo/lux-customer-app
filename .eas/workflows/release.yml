# LUX Booking — release pipeline (EAS Workflows).
#
# Manual only since 2026-09-13 (see `on:`). Day to day, build trains run
# locally: `npm run build-train -- all`.
#
# iOS: fingerprint the native project. If a production build with the same
#      native fingerprint already exists, publish an OTA update to the
#      `production` channel (reaches existing TestFlight builds). Otherwise
#      build + submit to App Store Connect (TestFlight). A version bump in
#      app.json always changes the fingerprint → native build.
# Android: same gate. Existing production build with this fingerprint →
#      OTA update to `production`; otherwise build the production AAB and
#      submit it to Google Play's INTERNAL track (eas.json submit.internal).
#      Play flip done 2026-09-08 (prompts/RELEASE_RUNBOOK.md): service
#      account play-publisher@lux-mirror.iam.gserviceaccount.com is uploaded to
#      EAS for this project and invited in Play Console. Store release =
#      change the submit profile to `production` (track production) later.
#
# Driven by the `release-mobile` Claude agent (mirror/.claude/agents).

name: Release (TestFlight + Play internal)

on:
  # Push trigger REMOVED 2026-09-13: the Expo free plan caps EAS Workflow jobs
  # at 60 CI minutes a month and September ran out. Until public launch,
  # build trains run from this machine with `npm run build-train -- all`
  # (scripts/release-train.mjs; prompts/RELEASE_RUNBOOK.md "Release trains").
  # Run this workflow by hand only when a paid plan or fresh minutes allow:
  #   npx eas-cli workflow:run .eas/workflows/release.yml
  workflow_dispatch: {}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect (TestFlight)
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  update_ios:
    name: Publish iOS OTA update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  build_android:
    name: Build Android AAB (production)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Android to Google Play (internal track)
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: internal

  update_android:
    name: Publish Android OTA update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: android
